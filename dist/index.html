<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f4" />
  <meta name="description" content="A clear, connected workspace for BPO operations." />
  <title>BPO SYSTEM — Operations workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="Northstar home">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5 19.4 12.6 28.5 16l-9.1 3.4L16 28.5l-3.4-9.1L3.5 16l9.1-3.4L16 3.5Z" fill="currentColor"/><circle cx="16" cy="16" r="2.3" fill="#18211a"/></svg></span>
        <span><strong>BPO SYSTEM</strong><small>OPERATIONS CLOUD</small></span>
      </a>
      <button class="workspace-switch" data-action="manage-connection"><span class="workspace-avatar">B</span><span class="workspace-copy"><strong>BPO SYSTEM</strong><small>Workspace · connection settings</small></span><span class="chevron">⌄</span></button>
      <div class="nav-label">WORKSPACE</div>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">▦</span> Overview <span class="nav-count live-count">LIVE</span></button>
        <button class="nav-item" data-page="contacts"><span class="nav-icon">◉</span> Contacts <span class="nav-count" id="contact-count">0</span></button>
        <button class="nav-item" data-page="campaigns"><span class="nav-icon">◷</span> Campaigns</button>
        <button class="nav-item" data-page="agents"><span class="nav-icon">♙</span> Agents</button>
        <button class="nav-item" data-page="calls"><span class="nav-icon">⌕</span> Call log</button>
        <button class="nav-item" data-page="quality"><span class="nav-icon">✳</span> Quality <span class="nav-dot"></span></button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span> Reports</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="support-card"><div class="support-glow"></div><div class="support-title">Your team, in sync.</div><p>Make every conversation count with one connected workspace.</p><button class="support-link" data-page="reports">Explore insights <span>↗</span></button></div>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span> Settings</button>
        <div class="profile-row"><span class="profile-avatar">MC</span><span class="profile-copy"><strong>Maya Chen</strong><small>Operations lead</small></span><button class="profile-menu" title="Profile options">···</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span>BPO SYSTEM</span><b>/</b><strong id="crumb-current">Overview</strong></div>
        <div class="top-actions">
          <div class="search-wrap"><span>⌕</span><input id="global-search" type="search" placeholder="Search anything…" aria-label="Search anything" /><kbd>⌘ K</kbd></div>
          <button class="icon-button" id="help-button" aria-label="Help">?</button>
          <button class="icon-button notification-button" id="notification-button" aria-label="Notifications">♧<i></i></button>
          <span class="top-avatar">MC</span>
        </div>
      </header>
      <div class="page-wrap">
        <section class="page active" id="page-overview"></section>
        <section class="page" id="page-contacts"></section>
        <section class="page" id="page-campaigns"></section>
        <section class="page" id="page-agents"></section>
        <section class="page" id="page-calls"></section>
        <section class="page" id="page-quality"></section>
        <section class="page" id="page-reports"></section>
        <section class="page" id="page-settings"></section>
      </div>
    </main>
  </div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div>
  <script src="app.js"></script>
</body>
</html>
