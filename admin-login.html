<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in — BPO SYSTEM</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#f6f7f4;font-family:Manrope,Arial;color:#18211a}.admin-login{min-height:100vh;display:grid;place-items:center;padding:24px}.admin-card{width:min(430px,100%);padding:36px;border:1px solid #dfe6df;border-radius:24px;background:#fff;box-shadow:0 24px 70px #18211a1f}.admin-card h1{margin:0 0 10px;font-size:30px}.admin-card p{color:#66736a}.admin-field{display:grid;gap:8px;margin:18px 0;font-weight:700}.admin-field input{padding:13px;border:1px solid #cfd9d0;border-radius:12px;font:inherit}.admin-submit{width:100%;padding:14px;border:0;border-radius:12px;background:#147a4d;color:#fff;font-weight:700;cursor:pointer}.admin-error{display:none;margin-top:14px;color:#9b2c2c}</style></head><body><main class="admin-login"><form class="admin-card" id="admin-form"><h1>Admin sign in</h1><p>Access the BPO SYSTEM operations dashboard.</p><label class="admin-field">Admin user ID<input name="username" autocomplete="username" required></label><label class="admin-field">Password<input name="password" type="password" autocomplete="current-password" required></label><button class="admin-submit">Continue to dashboard</button><div class="admin-error" id="admin-error">Incorrect admin user ID or password.</div></form></main><script>document.getElementById('admin-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});if(r.ok)location.href='/dashboard.html';else document.getElementById('admin-error').style.display='block'})</script></body></html>
